
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Challenge - Promises</title>
</head>
<body>

    <script>
        // Function 1: Convert all words to uppercase
        function makeAllCaps(words) {
            return new Promise((resolve, reject) => {

                // Check if all elements are strings
                if (words.every(word => typeof word === "string")) {

                    const upperWords = words.map(word => word.toUpperCase());

                    resolve(upperWords);

                } else {
                    reject("Error: All elements must be strings!");
                }
            });
        }

        // Function 2: Sort words alphabetically
        function sortWords(words) {
            return new Promise((resolve, reject) => {

                // Check if the array contains more than 4 elements
                if (words.length > 4) {

                    const sortedWords = words.sort();

                    resolve(sortedWords);

                } else {
                    reject("Error: The array must contain more than 4 words!");
                }
            });
        }

        // Test
        makeAllCaps(["apple", "pear", "banana", "melon", "kiwi"])
            .then((arr) => sortWords(arr))
            .then((result) => console.log(result))
            .catch(error => console.log(error));

    </script>

</body>
</html>
