<!DOCTYPE html>
<html>
<head>
    <title>Select a kind of Music</title>
</head>
<body>

    <select id="genres">
        <option value="rock">Rock</option>
        <option value="blues" selected>Blues</option>
    </select>

    <script>
        // 1. Get the select element
        let select = document.getElementById("genres");

        // 2. Display the selected value
        console.log(select.value);

        // 3. Create a new option
        let newOption = document.createElement("option");

        newOption.value = "classic";
        newOption.textContent = "Classic";

        // 4. Add the new option to the select
        select.appendChild(newOption);

        // 5. Select the new option by default
        newOption.selected = true;

        // Display the new selected value
        console.log(select.value);
    </script>

</body>
</html>
